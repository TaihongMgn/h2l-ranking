server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: 前端路由（vue-router history 模式）全部回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（hash 文件名）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
